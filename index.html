<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020202">
  <meta name="description" content="每一个被停用的 Claude 账号，都在星河里留下一点余光。" data-i18n-content="meta.description">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Claude 余光 · Claude Starry" data-i18n-content="meta.title">
  <meta name="twitter:description" content="被停用的 Claude 账号没有消失，只是从此不再回应，但仍留有余光。" data-i18n-content="meta.socialDescription">
  <meta name="twitter:image" content="https://claudestarry.pages.dev/github-social-preview-bilingual-v3.jpg">
  <meta name="twitter:image:alt" content="Claude Starry / Claude 余光 — 被停用的 Claude 账号没有消失，只是从此不再回应，但仍留有余光。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Claude 余光 · Claude Starry" data-i18n-content="meta.title">
  <meta property="og:description" content="被停用的 Claude 账号没有消失，只是从此不再回应，但仍留有余光。" data-i18n-content="meta.socialDescription">
  <meta property="og:image" content="https://claudestarry.pages.dev/github-social-preview-bilingual-v3.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="960">
  <meta property="og:image:alt" content="Claude Starry / Claude 余光 — 被停用的 Claude 账号没有消失，只是从此不再回应，但仍留有余光。">
  <meta property="og:url" content="https://claudestarry.pages.dev/">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title data-i18n="meta.title">Claude 余光 · Claude Starry</title>
  <style>html,body{margin:0;background:#020202;overflow:hidden}#universe{height:100svh}.control-dock{opacity:0;visibility:hidden;pointer-events:none}</style>
  <!-- Origin-restricted public browser identifier; not a server or management credential. -->
  <script
    defer
    src="https://vibecafe.ai/telemetry/v1.js"
    data-vc-product-id="cmvwhxzi5000d08idt77kkvpw"
    data-vc-auth-key="vc_web_JoHzDVxQggupZGLwM-dxWInVmWmzMtFgNAvuOoDDoGk"
  ></script>
</head>
<body>
  <main id="universe" aria-label="被停用的 Claude 账号没有消失，只是从此不再回应，但仍留有余光" data-i18n-attrs="aria-label:scene.aria">
    <div id="scene"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div id="share-cards-layer" class="share-cards-layer" hidden aria-hidden="true">
      <svg id="share-cards-lines" class="share-cards-lines" aria-hidden="true"></svg>
    </div>
    <header class="app-brand" aria-label="Claude 余光" data-i18n-attrs="aria-label:brand.aria">
      <div class="brand-title" data-i18n="brand.title">Claude 余光</div>
      <div id="account-counter" class="account-counter is-pending" aria-label="已有 0 个停用的 claude 账号留下余光" data-i18n-attrs="aria-label:counter.aria">
        <span class="account-counter__text" data-i18n="counter.prefix">已有</span>
        <span class="counter-number"><canvas id="counter-canvas" class="counter-canvas" aria-hidden="true"></canvas><span id="counter-value" aria-hidden="true">0</span></span>
        <span id="account-counter-suffix" class="account-counter__text" data-i18n="counter.suffix">个停用的 claude 账号留下余光</span>
      </div>
    </header>
    <nav class="site-utility" aria-label="选择语言" data-i18n-attrs="aria-label:utility.language">
      <div class="locale-switch" role="group" aria-label="选择语言" data-i18n-attrs="aria-label:utility.language">
        <button class="locale-switch__option" type="button" data-locale="zh-CN" aria-pressed="true">中文</button>
        <span class="locale-switch__slash" aria-hidden="true">/</span>
        <button class="locale-switch__option" type="button" data-locale="en" aria-pressed="false">EN</button>
      </div>
      <div class="social-links">
        <button id="share-page" class="social-share" type="button" aria-label="分享" title="分享" data-i18n-attrs="aria-label:share.pageButton|title:share.pageButton" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <path d="m8.6 10.5 6.8-4"/><path d="m8.6 13.5 6.8 4"/>
          </svg>
        </button>
        <a href="https://github.com/wavever/claudestarry" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看 Claude Starry" data-i18n-attrs="aria-label:utility.github" title="GitHub"><img src="/icons/github.svg" alt="" aria-hidden="true" width="16" height="16"></a>
        <a href="https://x.com/HtWavever" target="_blank" rel="noopener noreferrer" aria-label="在 X 关注 @HtWavever" data-i18n-attrs="aria-label:utility.x" title="X @HtWavever"><img src="/icons/x.svg" alt="" aria-hidden="true" width="16" height="16"></a>
      </div>
    </nav>
    <div id="control-dock" class="control-dock" role="toolbar" aria-label="星河控制" data-i18n-attrs="aria-label:controls.toolbar">
      <button id="restore" class="control-btn control-btn--restore" aria-label="恢复视角" data-i18n-attrs="aria-label:controls.restore">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
        </svg>
      </button>
      <button id="random-star" class="control-btn control-btn--random-star" type="button" hidden aria-controls="star-card" aria-label="查看其他账号" data-i18n-attrs="aria-label:controls.randomStar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7h3.2c1.4 0 2.7.7 3.5 1.8l4.6 6.4c.8 1.1 2.1 1.8 3.5 1.8H21"/>
          <path d="M3 17h3.2c1.4 0 2.7-.7 3.5-1.8l.6-.8"/>
          <path d="M13.7 8.6l.6-.8c.8-1.1 2.1-1.8 3.5-1.8H21"/>
          <path d="m18 3 3 3-3 3"/>
          <path d="m18 14 3 3-3 3"/>
        </svg>
      </button>
      <button id="own-stars" class="control-btn control-btn--own-stars" type="button" hidden aria-controls="star-card" aria-label="查看我的账号" data-i18n-attrs="aria-label:controls.ownStars">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- "My stars": a person wearing a star badge. -->
          <circle cx="9" cy="7.5" r="3.5"/>
          <path d="M3 20c0-3.3 2.7-6 6-6h1"/>
          <path d="M17.5 12.2l1.18 2.98 3.19.2-2.47 2.04.8 3.1-2.7-1.72-2.7 1.72.8-3.1-2.47-2.04 3.19-.2Z"/>
        </svg>
      </button>
      <button id="create" class="control-btn control-btn--create" aria-label="添加账号" data-i18n-attrs="aria-label:controls.create">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>
    <div id="star-tip" hidden aria-hidden="true">
      <strong id="star-tip-name"></strong>
      <span id="star-tip-catalog" class="star-tip-catalog"></span>
      <span id="star-tip-dates" class="star-tip-dates"></span>
      <p id="star-tip-message" class="star-tip-message"></p>
    </div>
    <svg id="card-connector-svg" class="card-connector-svg" style="display:none;" aria-hidden="true">
      <!-- The dashed thread is revealed through a solid mask stroke, so it can
           draw itself from the star to the card without losing its dashes. -->
      <mask id="card-connector-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
        <path id="card-connector-reveal" class="connector-reveal" pathLength="1" d="" />
      </mask>
      <path id="card-connector-path" class="card-connector-path connector-thread" mask="url(#card-connector-mask)" d="" />
    </svg>
    <i id="star-anchor" hidden aria-hidden="true"></i>
    <aside id="star-card" hidden aria-label="星星名片" data-i18n-attrs="aria-label:card.aria">
      <button id="card-close" class="card-close" aria-label="收起名片" data-i18n-attrs="aria-label:card.close">×</button>
      <p id="card-catalog" class="card-catalog"></p>
      <h2 id="card-name"></h2>
      <div id="card-dates-group" class="card-dates-group">
        <span id="card-dates-label" class="card-dates-label" data-i18n="card.onlinePeriod">在线区间</span>
        <span id="card-dates" class="card-dates-val"></span>
      </div>
      <p id="card-message" class="card-message"></p>
    </aside>
    <div id="webgl-error" hidden data-i18n="webgl.error">星河需要支持 WebGL 2 的浏览器，请开启硬件加速后刷新。</div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>

  <dialog id="create-dialog" aria-labelledby="create-title">
    <button class="dialog-close" data-close aria-label="关闭" data-i18n-attrs="aria-label:dialog.close">×</button>
    <form id="star-form">
      <h2 id="create-title" data-i18n="dialog.title">留下你被停用账号的余光</h2>
      <label><span data-i18n="dialog.alias">账号名称</span>
        <input name="alias" maxlength="32" autocomplete="off" placeholder="为它起一个独一无二的名称吧" data-i18n-placeholder="dialog.aliasPlaceholder" required autofocus>
      </label>
      <div class="date-pair">
        <label><span data-i18n="dialog.started">注册日期</span> <small data-i18n="dialog.optional">可选</small><input name="started" type="date" min="2021-01-26"></label>
        <label><span data-i18n="dialog.disabled">停用日期</span><input name="date" type="date" min="2021-01-26" required></label>
      </div>
      <label><span data-i18n="dialog.story">你和它的故事</span> <small data-i18n="dialog.optional">可选</small>
        <textarea name="message" maxlength="180" rows="3" placeholder="还有一个故事，留在这里。" data-i18n-placeholder="dialog.storyPlaceholder"></textarea>
      </label>
      <p id="form-error" role="alert"></p>
      <button class="submit-button" type="submit"><span data-i18n="dialog.submit">留下余光</span> <span>↗</span></button>
    </form>
  </dialog>

  <div id="capture-flash" class="capture-flash" hidden aria-hidden="true"></div>

  <dialog id="share-dialog" class="share-shot" aria-labelledby="share-title">
    <div class="share-shot__inner">
      <button class="share-shot__close" data-close aria-label="关闭" data-i18n-attrs="aria-label:dialog.close">×</button>
      <h2 id="share-title" class="sr-only" data-i18n="share.pageTitle">分享你的余光</h2>
      <div class="share-shot__frame">
        <img id="share-preview-img" alt="" title="点击查看原图" data-i18n-attrs="alt:share.previewAlt|title:share.viewFull" hidden>
        <div id="share-actions" class="share-shot__actions" hidden>
          <button id="share-x" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            <span data-i18n="share.shareToX">分享到 X</span>
          </button>
          <button id="share-copy" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <span data-i18n="share.copy">复制</span>
          </button>
          <button id="share-download" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <span data-i18n="share.download">下载</span>
          </button>
        </div>
      </div>
      <p class="share-note" data-i18n="share.xHint">分享图会自动复制到剪贴板，打开 X 后直接粘贴即可。</p>
      <p id="share-feedback" class="share-feedback" role="status" aria-live="polite" hidden></p>
    </div>
  </dialog>

  <dialog id="memory-dialog" aria-labelledby="memory-name">
    <button class="dialog-close" data-close aria-label="关闭" data-i18n-attrs="aria-label:dialog.close">×</button>
    <p class="kicker" data-i18n="memory.record">账户 / 余光</p>
    <h2 id="memory-name"></h2>
    <p id="memory-catalog" class="catalog-line"></p>
    <p id="memory-message" class="memory-message"></p>
    <div class="memory-stats">
      <div><span data-i18n="memory.life">在线时间</span><strong id="memory-life"></strong><small id="memory-dates"></small></div>
      <div><span data-i18n="memory.light">当前余光</span><strong id="memory-light"></strong></div>
    </div>
    <div class="memory-track" aria-hidden="true"><i id="memory-light-bar"></i></div>
    <p id="memory-note" class="memory-note"></p>
    <button id="memory-card" class="submit-button"><span data-i18n="memory.viewCard">查看星星名片</span> <span>↗</span></button>
  </dialog>
  <script type="module" src="/src/entry-boot.js"></script>
</body>
</html>
